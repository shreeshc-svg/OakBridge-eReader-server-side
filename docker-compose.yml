version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: oakbridge_redis
    restart: always
    networks:
      - app-network
    expose:
      - "6379"

  backend:
    build: .
    container_name: oakbridge_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - app-network

networks:
  app-network:
    external: true
